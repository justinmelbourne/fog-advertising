# SF Fog RFC Rugby Video Analysis — Cloud Run Deployment Config
# =============================================================
# Triggered automatically on push to main via Cloud Build trigger,
# or manually via: gcloud builds submit --config=cloudbuild.yaml
#
# Project:  sffog-video-analysis
# Region:   us-west1
# Registry: us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/fog-video-analysis:$_COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/fog-video-analysis:latest'
      - '.'

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/fog-video-analysis'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fog-video-analysis'
      - '--image=us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/fog-video-analysis:$_COMMIT_SHA'
      - '--region=us-west1'
      - '--platform=managed'
      - '--service-account=fog-video-sa@sffog-video-analysis.iam.gserviceaccount.com'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=600'
      - '--concurrency=10'
      - '--max-instances=5'
      - '--session-affinity'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=sffog-video-analysis'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VEO_API_TOKEN=veo-api-token:latest,DRIVE_INGEST_FOLDER_ID=drive-ingest-folder-id:latest,DRIVE_OUTPUT_FOLDER_ID=drive-output-folder-id:latest'
      - '--allow-unauthenticated'

images:
  - 'us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/fog-video-analysis:$_COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/sffog-video-analysis/fog-video/fog-video-analysis:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMMIT_SHA: 'manual'
